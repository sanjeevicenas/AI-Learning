<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEN AI Learning Path</title>
<style>
  :root{
    --bg:#0f1117; --panel:#1a1d24; --panel2:#12141a; --border:#2a2f3a;
    --text:#e6e9ef; --muted:#9aa4b6; --accent:#ff6b3d; --chip:#222734;
    --mark:#ffd24a;
  }
  body.light{
    --bg:#f4f6fb; --panel:#ffffff; --panel2:#eef1f7; --border:#d3d9e6;
    --text:#1b2030; --muted:#5b6678; --chip:#e7ebf4; --mark:#ffe17a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.45}

  header{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--border);padding:12px 16px}
  .htop{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
  h1{font-size:1.15rem;white-space:nowrap}
  h1 .accent{color:var(--accent)}
  .stats{display:flex;gap:8px;flex-wrap:wrap}
  .stat{background:var(--chip);border:1px solid var(--border);border-radius:7px;padding:4px 10px;font-size:.74rem;font-weight:700}
  .stat b{color:var(--accent)}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-left:auto}
  .controls input[type=search]{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 11px;font-size:.82rem;min-width:190px;font-family:inherit}
  .btn{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 11px;font-size:.78rem;font-weight:700;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:var(--accent)}

  .legend{display:flex;flex-wrap:wrap;gap:7px 14px;padding:9px 16px 11px;border-bottom:1px solid var(--border);background:var(--panel2)}
  .legend .li{display:flex;align-items:center;gap:6px;font-size:.74rem;color:var(--muted);font-weight:600}
  .legend .dot{width:12px;height:12px;border-radius:3px;flex:0 0 auto}

  /* full-width stacked course sections (static, no clipping) */
  #columns{display:flex;gap:16px;padding:16px;overflow-x:auto;align-items:flex-start}
  .course{flex:0 0 360px;max-width:360px;background:var(--panel);border:1px solid var(--border);border-top:4px solid var(--accent);border-radius:12px;overflow:hidden}
  .course-head{padding:12px 16px;font-weight:800;font-size:.92rem;color:var(--accent);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:10px;align-items:flex-start;line-height:1.3}
  .course-head>span:first-child{flex:1;min-width:0;overflow-wrap:anywhere}
  .course-head .cnt{flex:0 0 auto;font-size:.68rem;color:var(--muted);background:var(--chip);border-radius:10px;padding:2px 9px;font-weight:700}
  .course-body{padding:6px 10px 12px}

  /* each topic/subtopic is one full-width row; indentation by padding only
     (flat list — never shrinks the text box, so nothing overflows/clips) */
  .row{display:flex;align-items:flex-start;gap:7px;padding:4px 8px;border-radius:6px;border-left:2px solid transparent}
  .row:hover{background:var(--panel2)}
  .row.hide{display:none}
  .mk{flex:0 0 auto;width:13px;text-align:center;color:var(--muted);font-size:.7rem;margin-top:3px}
  .lab{flex:1;min-width:0;font-size:.82rem;overflow-wrap:anywhere}
  .badge{flex:0 0 auto;font-size:.62rem;color:var(--muted);background:var(--chip);border-radius:9px;padding:1px 7px;font-weight:700;margin-top:2px}
  mark{background:var(--mark);color:#1a0e08;border-radius:3px;padding:0 2px}

  /* depth styling — conveyed by indentation (inline padding) + size/weight, not color alone */
  .row.d0{border-left-color:var(--accent)}
  .row.d0 .lab{font-weight:800;font-size:.86rem}
  .row.d1 .lab{font-weight:700;font-size:.82rem}
  .row.d2 .lab{font-weight:700}
  .row.d3 .lab{font-weight:600}
  .row.d4 .lab{font-weight:500}
  .row.d5 .lab,.row.d6 .lab{font-weight:500;color:var(--muted);font-size:.78rem}
  .empty{color:var(--muted);text-align:center;padding:50px 16px;font-size:.9rem}

  footer{color:var(--muted);font-size:.74rem;padding:14px 16px 30px;border-top:1px solid var(--border);margin-top:8px;max-width:1100px;margin-left:auto;margin-right:auto}

  @media(max-width:640px){
    .course{flex:0 0 86vw;max-width:86vw}
    .controls{margin-left:0;width:100%}
    .controls input[type=search]{flex:1;min-width:0}
  }
  @media print{
    header{position:static} .controls,.btn{display:none}
    #columns{display:block;overflow:visible}
    .course{flex:none;max-width:100%;margin-bottom:14px;page-break-inside:auto;border-color:#bbb}
    .row{break-inside:avoid}
    body{background:#fff;color:#000}
  }
</style>

/* ---------- helpers ---------- */
const PALETTE = ["#2d7dd2","#2ea043","#d27d2d","#9e2db5","#1aa3a3","#d23d6b","#c9a227"];
function el(tag,cls){ const e=document.createElement(tag); if(cls)e.className=cls; return e; }
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function hl(text,f){ const e=escapeHtml(text); if(!f) return e;
  const i=text.toLowerCase().indexOf(f); if(i<0) return e;
  return escapeHtml(text.slice(0,i))+"<mark>"+escapeHtml(text.slice(i,i+f.length))+"</mark>"+escapeHtml(text.slice(i+f.length)); }

/* ---------- parse the embedded outline into a nested tree ---------- */
function parseOutline(raw){
  const lines = raw.split(/\r?\n/);
  const root = {text:"__root__", children:[]};
  const stack = [{node:root, rank:-1, indent:-1}]; // rank: 0 course,1 module,2 notebook, null = content (use indent)
  let nodeCount=0, skipped=0;

  for(const rawLine of lines){
    const line = rawLine.replace(/\s+$/,"");        // rstrip
    if(line.trim()===""){ skipped++; continue; }
    const t = line.trim();
    if(/^=+$/.test(t)){ skipped++; continue; }                  // === separators
    if(/^[─-╿]+$/.test(t)){ skipped++; continue; }    // ─ box-drawing separators
    if(/^GENERATIVE AI COURSES/i.test(t)){ skipped++; continue; }
    if(/^Databricks Platform$/i.test(t)){ skipped++; continue; }
    if(/^END OF OUTLINE$/i.test(t)){ skipped++; continue; }
    if(/^SUMMARY STATISTICS$/i.test(t)) break;   // stop here — exclude the Summary Statistics section

    const indent = (rawLine.match(/^[ \t]*/)[0]).replace(/\t/g,"    ").length;
    const lead = t.replace(/^[^\wA-Za-z]+/,""); // strip leading emoji/symbols for keyword tests

    let rank=null;
    if(/^COURSE\s+\d+/i.test(lead)) rank=0;
    else if(/^MODULE\s+\d+/i.test(t)) rank=1;
    else if(indent===0 && /^\d/.test(t)) rank=2;   // notebook line e.g. "1.1 LECTURE", "00-Build-Model"

    // display text: strip pure list markers (• - *) but keep A./1./1.1 prefixes
    const display = t.replace(/^[•▪◦]\s*/,"").replace(/^[-*]\s+/,"");
    const node = {text:display, children:[]};

    if(rank!==null){
      while(stack.length>1 && stack[stack.length-1].rank===null) stack.pop();           // clear content
      while(stack.length>1 && stack[stack.length-1].rank!==null &&
            stack[stack.length-1].rank>=rank) stack.pop();                              // pop equal/deeper structure
      stack[stack.length-1].node.children.push(node);
      stack.push({node, rank, indent:-1});
    } else {
      while(stack.length>1 && stack[stack.length-1].rank===null &&
            stack[stack.length-1].indent>=indent) stack.pop();                          // pop equal/deeper content
      stack[stack.length-1].node.children.push(node);
      stack.push({node, rank:null, indent});
    }
    nodeCount++;
  }
  return {root, nodeCount, skipped};
}

/* ---------- precompute descendant counts + max depth ---------- */
let MAXDEPTH=0;
function annotate(node, depth){
  MAXDEPTH=Math.max(MAXDEPTH,depth);
  let total=0;
  node.children.forEach(c=>{ total += 1 + annotate(c, depth+1); });
  node.count=total;
  return total;
}

/* ---------- render ---------- */
const tree = parseOutline(document.getElementById("outline").textContent);
tree.root.children.forEach(b=>annotate(b,0));
const columnsEl = document.getElementById("columns");
const legendEl  = document.getElementById("legend");

/* Static flat-outline render: every topic/subtopic is its own full-width row,
   indented purely by padding (no nested width-shrinking boxes), so deep text
   always wraps inside the page and can never overflow/clip. */
function collect(node, depth, filter, rows){
  const selfMatch = filter && node.text.toLowerCase().includes(filter);
  const childRows = [];
  node.children.forEach(c=>collect(c, depth+1, filter, childRows));
  if(filter && !selfMatch && childRows.length===0) return;   // prune branches with no match
  rows.push(makeRow(node, depth, filter));
  childRows.forEach(r=>rows.push(r));
}

function makeRow(node, depth, filter){
  const row = el("div","row d"+Math.min(depth,6));
  row.style.paddingLeft = (8 + depth*15) + "px";
  const mk = el("span","mk");
  mk.textContent = depth===0 ? "▸" : (depth===1 ? "▪" : "•");
  const lab = el("span","lab"); lab.innerHTML = hl(node.text, filter);
  row.appendChild(mk); row.appendChild(lab);
  if(node.count>0){ const b=el("span","badge"); b.textContent=node.count; row.appendChild(b); }
  return row;
}

function render(filterRaw){
  const filter = (filterRaw||"").trim().toLowerCase();
  columnsEl.innerHTML="";
  let shown=0;
  tree.root.children.forEach((branch,i)=>{
    const color = PALETTE[i % PALETTE.length];
    const rows=[];
    branch.children.forEach(c=>collect(c,0,filter,rows));
    const branchMatch = filter && branch.text.toLowerCase().includes(filter);
    if(filter && !branchMatch && rows.length===0) return;     // hide non-matching course when searching
    const sec = el("section","course"); sec.style.setProperty("--accent",color);
    const head = el("div","course-head");
    head.innerHTML = '<span>'+hl(branch.text,filter)+'</span><span class="cnt">'+branch.count+'</span>';
    sec.appendChild(head);
    const body = el("div","course-body");
    rows.forEach(r=>body.appendChild(r));
    sec.appendChild(body);
    columnsEl.appendChild(sec);
    shown++;
  });
  if(!shown) columnsEl.innerHTML='<div class="empty">No matching topics.</div>';
}

function buildLegend(){
  legendEl.innerHTML="";
  tree.root.children.forEach((branch,i)=>{
    const color = PALETTE[i % PALETTE.length];
    const li = el("div","li");
    li.innerHTML = '<span class="dot" style="background:'+color+'"></span>'+escapeHtml(branch.text);
    legendEl.appendChild(li);
  });
}

/* ---------- controls ---------- */
document.getElementById("printBtn").onclick=()=>window.print();
document.getElementById("themeBtn").onclick=function(){
  document.body.classList.toggle("light");
  this.textContent = document.body.classList.contains("light") ? "🌙 Dark" : "☀ Light";
};
let tmr=null;
document.getElementById("search").addEventListener("input",e=>{
  clearTimeout(tmr); const v=e.target.value;
  tmr=setTimeout(()=>render(v),120);
});

/* ---------- stats + initial render ---------- */
document.getElementById("s-top").textContent   = tree.root.children.length;
document.getElementById("s-nodes").textContent = tree.nodeCount;
document.getElementById("s-depth").textContent = MAXDEPTH+1;
document.getElementById("footer").innerHTML =
  "Top-level topics: <b>"+tree.root.children.length+"</b> &middot; total nodes: <b>"+tree.nodeCount+
  "</b> &middot; max depth: <b>"+(MAXDEPTH+1)+"</b> levels &middot; non-content lines skipped: "+tree.skipped+
  ". &nbsp;Static view — all topics and subtopics are shown; use search to filter. Built dynamically from the embedded outline — edit that block to update.";

buildLegend();
render("");
</script>
</body>
</html>
