<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Certified Architect — Practice Quiz</title>
<style>
  :root{
    --bg:#f3f4f6; --card:#ffffff; --ink:#1f2430; --muted:#5b6473; --line:#e3e6eb;
    --accent:#3b3f8f; --accent2:#5457b6;
    --okbg:#dcfce7; --okbd:#15803d; --okink:#14532d;
    --nobg:#fee2e2; --nobd:#b91c1c; --noink:#7f1d1d;
    --warn:#9a3412; --warnbg:#ffedd5;
    --d1:#b3122f; --d2:#0f6e6e; --d3:#2e7d32; --d4:#1d4ed8; --d5:#c2410c;
    --shadow:0 1px 3px rgba(20,24,40,.08),0 6px 18px rgba(20,24,40,.06);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;font-size:16px}
  .wrap{max-width:920px;margin:0 auto;padding:0 16px}

  /* sticky header */
  .appbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 8px rgba(20,24,40,.05)}
  .appbar .wrap{padding-top:12px;padding-bottom:10px}
  .titlerow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .titlerow h1{font-size:18px;margin:0;letter-spacing:-.01em}
  .titlerow .cert{color:var(--muted);font-weight:400}
  .scoreline{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .scoreline b{color:var(--ink)}
  .pbar{height:6px;background:#e9ebf0;border-radius:6px;margin:8px 0 10px;overflow:hidden}
  .pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .25s}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{font:inherit;font-size:12.5px;font-weight:600;border:1.5px solid var(--line);background:#fff;color:var(--muted);
    padding:5px 10px;border-radius:20px;cursor:pointer;white-space:nowrap}
  .tab:hover{border-color:#c8ccd6}
  .tab[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tab .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .tab .cnt{opacity:.8;font-weight:700}
  .btn{font:inherit;font-weight:600;border:1.5px solid var(--line);background:#fff;color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer}
  .btn:hover{border-color:#c8ccd6}
  .btn.reset{color:var(--nobd);border-color:#f0c8c8}

  main{padding:18px 0 60px}

  /* weightage panel */
  details.weight{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}
  details.weight>summary{cursor:pointer;list-style:none;padding:14px 18px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:10px}
  details.weight>summary::-webkit-details-marker{display:none}
  details.weight>summary .chev{transition:transform .2s;color:var(--muted)}
  details.weight[open]>summary .chev{transform:rotate(90deg)}
  .weight-body{padding:4px 18px 18px}
  .dom-row{margin:14px 0}
  .dom-head{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;margin-bottom:4px}
  .dom-head .pct{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
  .dom-meter{height:12px;background:#eef0f4;border-radius:8px;overflow:hidden}
  .dom-meter i{display:block;height:100%;border-radius:8px}
  .subs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0 4px}
  .sub{font-size:12px;color:var(--muted);background:#f5f6f9;border:1px solid var(--line);border-radius:14px;padding:3px 9px}
  .sub b{color:var(--ink);font-variant-numeric:tabular-nums}

  /* question cards */
  .qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;margin:14px 0}
  .qtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .qnum{font-weight:800;font-size:13px;background:var(--ink);color:#fff;border-radius:7px;padding:2px 9px;font-variant-numeric:tabular-nums}
  .chip{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:20px;color:#fff;letter-spacing:.01em}
  .chip.sub{background:#eef0f4;color:var(--muted);font-weight:600}
  .chip.flag{background:var(--warnbg);color:var(--warn);border:1px solid #f0c89a}
  .qtext{font-size:16.5px;font-weight:600;margin:2px 0 12px;white-space:pre-wrap}
  pre.code{background:#0f1626;color:#e7ecf5;border-radius:10px;padding:12px 14px;overflow-x:auto;font-family:var(--mono);font-size:13px;margin:0 0 12px}
  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;font:inherit;font-size:15px;
    background:#fff;border:1.6px solid var(--line);border-radius:10px;padding:11px 13px;cursor:pointer;color:var(--ink)}
  .opt:hover:not(:disabled){border-color:#b9bdc9;background:#fafbfc}
  .opt:disabled{cursor:default}
  .opt .letter{font-weight:800;font-family:var(--mono);font-size:13px;min-width:20px;color:var(--muted)}
  .opt .otext{flex:1}
  .opt .mark{font-weight:800;min-width:18px;text-align:center}
  .opt .tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;align-self:center;padding:2px 7px;border-radius:12px}
  .opt.correct{background:var(--okbg);border-color:var(--okbd)}
  .opt.correct .mark,.opt.correct .tag{color:var(--okink)}
  .opt.correct .tag{background:#bbf7d0}
  .opt.wrong{background:var(--nobg);border-color:var(--nobd)}
  .opt.wrong .mark,.opt.wrong .tag{color:var(--noink)}
  .opt.wrong .tag{background:#fecaca}
  .opt.chosenbox{outline:2px solid var(--accent);outline-offset:1px}
  .opt input{margin-top:3px}
  .checkbtn{margin-top:10px}
  .explain{margin-top:12px;border-left:4px solid var(--accent);background:#f6f7fb;border-radius:0 10px 10px 0;padding:10px 14px;font-size:14.5px;display:none}
  .explain.show{display:block}
  .explain .lbl{font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-bottom:3px}
  .explain.warn{border-left-color:var(--warn);background:var(--warnbg)}
  .explain.warn .lbl{color:var(--warn)}
  .verify{display:inline-block;margin-top:6px;font-size:12.5px;color:var(--warn);font-weight:700}
  .empty{text-align:center;color:var(--muted);padding:40px}
  footer{color:var(--muted);font-size:12.5px;text-align:center;padding:24px 16px 50px}
  .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
  @media(max-width:560px){
    body{font-size:15px}
    .titlerow h1{font-size:16px}
    .opt{font-size:14.5px}
    .qtext{font-size:15.5px}
  }
</style>
</head>
<body>
<header class="appbar">
  <div class="wrap">
    <div class="titlerow">
      <h1>Claude Certified Architect <span class="cert">· Practice Quiz</span></h1>
      <div class="scoreline" id="scoreline">Answered 0/0 · 0 correct · 0%</div>
    </div>
    <div class="pbar"><i id="pbar"></i></div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Filter by domain"></div>
  </div>
</header>

<main><div class="wrap">
  <details class="weight" open>
    <summary><span>📊 Exam Weightage (by domain &amp; subtopic)</span><span class="chev">▶</span></summary>
    <div class="weight-body" id="weightBody"></div>
  </details>

  <div style="display:flex;justify-content:flex-end;margin-bottom:6px">
    <button class="btn reset" id="resetBtn" type="button">↻ Reset all</button>
  </div>

  <div id="quiz"></div>
</div></main>

<footer>
  Self-contained practice app · all state in memory (nothing saved) · answers inferred from the official exam guide; items marked <span style="color:var(--warn);font-weight:700">⚠ verify</span> should be confirmed against official material.
</footer>

<script>
/* ============================================================================
   HOW TO ADD A NEW QUESTION
   ----------------------------------------------------------------------------
   Push an object onto QUESTIONS with this shape (everything recalculates on
   reload — score denominator, tab counts, and the weightage panel are all
   computed dynamically from this array):

     {
       n: 61,                         // question number (shown on the card)
       domain: "D3",                  // one of the keys in DOMAIN_META (D1..D5)
       subtopic: "Plan Mode vs Direct",// short, reused label describing what it tests
       question: `Full question text, verbatim.`,
       code: ``,                      // OPTIONAL: multi-line code/command block (monospaced)
       options: [ `Option A`, `Option B`, `Option C`, `Option D` ],
       correct: [1],                  // 0-based index/indexes of the correct option(s)
       multi: false,                  // OPTIONAL: true for "choose two/three" (renders checkboxes + Check)
       explanation: `Why the answer is correct (+ why distractors are wrong).`,
       flag: false                    // OPTIONAL: true => shows "⚠ verify" badge + note
     }

   Use backtick-delimited strings so quotes/apostrophes need no escaping. If your
   text needs a literal dollar-then-brace sequence, put a backslash before the
   dollar sign so it is not treated as template interpolation.
   ========================================================================== */

const DOMAIN_META = {
  D1:{ name:"Domain 1 · Agentic Architecture & Orchestration", short:"Agentic & Orchestration", color:"#b3122f" },
  D2:{ name:"Domain 2 · Tool Design & MCP Integration",        short:"Tools & MCP",            color:"#0f6e6e" },
  D3:{ name:"Domain 3 · Claude Code Configuration & Workflows",short:"Claude Code Config",     color:"#2e7d32" },
  D4:{ name:"Domain 4 · Prompt Engineering & Structured Output",short:"Prompt & Output",       color:"#1d4ed8" },
  D5:{ name:"Domain 5 · Context Management & Reliability",     short:"Context & Reliability",  color:"#c2410c" }
};
const DOMAIN_ORDER = ["D1","D2","D3","D4","D5"];

const QUESTIONS = [
{ n:1, domain:"D5", subtopic:"Error Propagation",
  question:`During a materials research task, the web search subagent queries three source categories with different outcomes: academic databases returned 15 relevant papers, industry reports returned "0 results found," and patent databases returned "Connection timeout." When designing error propagation to the coordinator, what approach enables the best recovery decisions?`,
  options:[
    `Have the subagent retry transient failures internally and only report persistent errors.`,
    `Distinguish access failures (timeout) needing retry decisions from valid empty results ("0 results") representing successful queries.`,
    `Report both the timeout and "0 results" as failures requiring coordinator intervention.`,
    `Aggregate outcomes into a single success rate metric (e.g., "67% source coverage") with detailed logs available on request.`],
  correct:[1],
  explanation:`Distinguishing access failures (a timeout needs a retry decision) from valid empty results (a successful query with no matches) lets the coordinator act correctly on each. Lumping them together (C) or hiding them in an aggregate metric (D) destroys the signal; retrying internally only (A) withholds useful context.` },

{ n:2, domain:"D1", subtopic:"Coordinator Orchestration",
  question:`A colleague suggests having the document analysis agent send its output directly to the synthesis agent instead of routing through the coordinator. What is the main advantage of keeping the coordinator as the central hub for all subagent communication?`,
  options:[
    `The coordinator can observe all interactions, handle errors consistently, and decide what information each subagent should receive`,
    `Subagents operate with isolated memory, and direct communication would require complex serialization that only the coordinator can perform`,
    `Routing through the coordinator enables automatic retry logic that direct agent-to-agent calls cannot support`,
    `The coordinator batches multiple subagent requests together, reducing the total number of API calls and overall latency`],
  correct:[0],
  explanation:`A central coordinator gives observability, consistent error handling, and control over what each subagent receives. The other options state false technical constraints (B, C) or a minor latency benefit (D) that isn't the primary reason.` },

{ n:3, domain:"D5", subtopic:"Provenance & Conflicts",
  question:`The document analysis agent discovers that two credible sources contain directly conflicting statistics on a key metric: one government report states 40% growth while an industry analysis states 12% growth. Both sources appear legitimate and the discrepancy could significantly affect the research conclusions. What's the most effective way for the document analysis agent to handle this?`,
  options:[
    `Complete the document analysis with both figures included, explicitly annotate the conflict with source attribution, and let the coordinator decide how to reconcile before passing to synthesis.`,
    `Halt analysis and escalate to the coordinator immediately, asking it to determine which source is authoritative before the agent continues processing remaining documents.`,
    `Include both figures in the analysis output without flagging them as conflicting, allowing the synthesis agent to determine which to use based on the broader research context.`,
    `Apply source credibility heuristics to select the most likely accurate figure, complete the analysis using that value, and include a footnote mentioning the discrepancy.`],
  correct:[0],
  explanation:`Keep both values, annotate the conflict with source attribution, and let the coordinator reconcile — preserving provenance. Picking one via heuristics (D) or not flagging the conflict (C) loses information; halting all work (B) is unnecessary.` },

{ n:4, domain:"D2", subtopic:"Scoped Tool Access",
  question:`During testing, you observe that the synthesis agent frequently needs to verify specific claims while combining findings. Currently, when verification is needed, the synthesis agent returns control to the coordinator, which invokes the web search agent, then re-invokes synthesis with results. This adds 2-3 round trips per task and increases latency by 40%. Your evaluation shows that 85% of these verifications are simple fact-checks (dates, names, statistics) while 15% require deeper investigation. What's the most effective approach to reduce overhead while maintaining system reliability?`,
  options:[
    `Give the synthesis agent access to all web search tools so it can handle any verification need directly without round-trips through the coordinator.`,
    `Give the synthesis agent a scoped verify_fact tool for simple lookups, while complex verifications continue delegating to the web search agent through the coordinator.`,
    `Have the web search agent proactively cache extra context around each source during initial research, anticipating what the synthesis agent might need to verify.`,
    `Have the synthesis agent accumulate all verification needs and return them as a batch to the coordinator at the end of its pass, which then sends them all to the web search agent at once.`],
  correct:[1],
  explanation:`Least privilege: give synthesis a scoped verify_fact tool for the common simple lookups, and keep routing the complex 15% through the coordinator. Giving all tools (A) over-provisions; speculative caching (C) is unreliable; end-of-pass batching (D) breaks step dependencies.` },

{ n:5, domain:"D5", subtopic:"Local Error Recovery",
  question:`The document analysis subagent frequently encounters failures when processing PDF files—some have corrupted sections causing parsing exceptions, others are password-protected, and occasionally the parsing library times out on large files. Currently, any exception immediately terminates the subagent and returns an error to the coordinator, which must decide whether to retry, skip the document, or fail the entire research task. This is causing excessive coordinator involvement in routine error handling. What's the most effective architectural improvement?`,
  options:[
    `Have the subagent implement local recovery for transient failures and only propagate errors it cannot resolve to the coordinator, including what was attempted and any partial results obtained.`,
    `Create a dedicated error-handling agent that monitors all subagent failures via a shared queue and makes recovery decisions independently, dispatching retry commands directly to subagents.`,
    `Have the coordinator validate all documents before dispatching to the subagent, rejecting documents likely to cause failures to ensure the subagent only receives processable files.`,
    `Configure the subagent to always return partial results with success status, embedding error details in metadata. The coordinator treats all responses as successful and filters problematic items during synthesis.`],
  correct:[0],
  explanation:`Have subagents recover locally from transient failures and propagate only what they can't resolve, with attempts and partial results — cutting coordinator load. A separate error agent (B) or pre-validation (C) adds complexity; masking failures as success (D) hides real problems.` },

{ n:6, domain:"D2", subtopic:"Tool Description Design",
  question:`Production logs reveal a consistent pattern: requests to "analyze the quarterly report I uploaded" are routed to the web search agent 45% of the time instead of the document analysis agent. Examining the tool definitions, you find the web search agent has an analyze_content tool described as "analyzes content and extracts key information," while the document analysis agent has an analyze_document tool described as "analyzes documents and extracts key information." How should you address this misrouting?`,
  options:[
    `Rename the web search tool to extract_web_results and update its description to "processes and returns information retrieved from web searches and URLs."`,
    `Expand the document analysis tool's description to include example use cases like "Use for uploaded PDFs, Word documents, and spreadsheets" while leaving the web search tool unchanged.`,
    `Add few-shot examples to the coordinator's prompt showing correct routing: "User uploads quarterly report → document analysis agent" and "User asks about a webpage → web search agent."`,
    `Add a pre-routing classifier that determines whether the user is referencing uploaded files or web content before the coordinator makes delegation decisions.`],
  correct:[0],
  explanation:`Rename and redescribe the web tool (extract_web_results, web-specific description) to remove the near-identical overlap that causes misrouting. Expanding only one description (B) leaves ambiguity; few-shot (C) and a classifier (D) paper over the root-cause naming problem.` },

{ n:7, domain:"D5", subtopic:"Lost-in-the-Middle",
  question:`Production monitoring reveals inconsistent synthesis quality. When aggregated results total ~75K tokens, the synthesis agent reliably cites information from the first 15K tokens (web search headlines and snippets) and the final 10K tokens (document analysis conclusions), but frequently omits critical findings that appear in the middle 50K tokens—even when those findings directly address the research question. How should you restructure the aggregated input?`,
  options:[
    `Place a key findings summary at the beginning of the aggregated input and organize detailed results with explicit section headers for easier navigation.`,
    `Summarize all subagent outputs to under 20K tokens total before aggregation, ensuring content stays within the model's reliable processing range.`,
    `Stream subagent results to the synthesis agent incrementally, processing web search results first to completion before introducing document analysis findings.`,
    `Implement rotation that alternates which subagent's results appear first across different research tasks, ensuring both sources receive primacy positioning equally over time.`],
  correct:[0],
  explanation:`This is the "lost in the middle" effect — put a key-findings summary at the start and use explicit section headers so critical content sits where the model reads reliably. Aggressive summarization (B) loses detail; streaming (C) and rotation (D) don't guarantee the middle is read.` },

{ n:8, domain:"D5", subtopic:"Coverage Gap Reporting",
  question:`The web search subagent returns results for only 3 of 5 requested source categories (competitor websites and industry reports succeeded, but news archives and social media feeds timed out). The document analysis subagent successfully processed all provided documents. The synthesis subagent must now produce a findings summary from this mixed-quality input. What's the most effective error propagation strategy?`,
  options:[
    `Have the synthesis subagent return an error to the coordinator indicating incomplete upstream data, triggering a full retry or task failure.`,
    `Have the synthesis subagent request the coordinator retry the timed-out sources with extended timeouts before proceeding, ensuring complete data coverage before synthesis begins.`,
    `Structure the synthesis output with coverage annotations indicating which findings are well-supported versus which topic areas have gaps due to unavailable sources.`,
    `Proceed with synthesis using only the successful sources, generating output without indicating which data was unavailable.`],
  correct:[2],
  explanation:`Annotate the synthesis output with coverage notes (well-supported vs. gaps from unavailable sources) and proceed — preserving reliability information. Failing or forcing retries (A, B) is heavy-handed; omitting the gaps entirely (D) hides what's missing.` },

{ n:9, domain:"D1", subtopic:"Coordinator Orchestration",
  question:`Scenario: Multi-Agent Research System. The web search and document analysis agents have both completed their tasks and returned findings to the coordinator. What is the appropriate next step for producing an integrated research output?`,
  options:[
    `Each agent directly sends its findings to the report generation agent, bypassing the coordinator`,
    `The coordinator passes both sets of findings to the synthesis agent for unified integration`,
    `The coordinator concatenates the raw outputs from both agents and returns them as the final result`,
    `The document analysis agent requests the web search results and merges them internally`],
  correct:[1],
  explanation:`The coordinator passes both result sets to the synthesis agent for unified integration. Direct agent-to-agent paths (A, D) bypass the hub; concatenating raw output (C) isn't true synthesis.` },

{ n:10, domain:"D2", subtopic:"Constrained Tool Design",
  question:`When designing the system, you gave the document analysis agent access to a general-purpose fetch_url tool so it could load documents from URLs. Production logs reveal this agent now frequently fetches search engine result pages to conduct ad-hoc web searches—behavior that should route through the web search agent. This causes inconsistent results. What's the most effective fix?`,
  options:[
    `Implement filtering that blocks fetch_url calls to known search engine domains while allowing other URLs.`,
    `Add instructions to the document analysis agent's prompt clarifying it should only use fetch_url for loading document URLs, not searching.`,
    `Remove fetch_url from the document analysis agent and route all URL loading through the coordinator to the web search agent.`,
    `Replace fetch_url with a load_document tool that validates URLs point to document formats.`],
  correct:[3],
  explanation:`Replace the generic fetch_url with a constrained load_document tool that validates document URLs, removing the ability to ad-hoc search. Domain blocklists (A) and prompt instructions (B) are brittle; routing everything through the coordinator (C) is heavier than needed.` },

{ n:11, domain:"D1", subtopic:"Task Decomposition",
  question:`After running the system on the topic "impact of AI on creative industries," you observe that each subagent completes successfully: the web search agent finds relevant articles, the document analysis agent summarizes papers correctly, and the synthesis agent produces coherent output. However, the final reports cover only visual arts, completely missing music, writing, and film production. When you examine the coordinator's logs, you see it decomposed the topic into three subtasks: "AI in digital art creation," "AI in graphic design," and "AI in photography." What is the most likely root cause?`,
  options:[
    `The synthesis agent lacks instructions for identifying coverage gaps in the findings it receives from other agents.`,
    `The document analysis agent is filtering out sources related to non-visual creative industries due to overly restrictive relevance criteria.`,
    `The web search agent's queries are not comprehensive enough and need to be expanded to cover more creative industry sectors.`,
    `The coordinator agent's task decomposition is too narrow, resulting in subagent assignments that don't cover all relevant domains of the topic.`],
  correct:[3],
  explanation:`The coordinator decomposed "creative industries" into only visual-arts subtasks, so whole domains (music, writing, film) were never assigned. The subagents executed their scope correctly, so A/B/C blame the wrong components.` },

{ n:12, domain:"D5", subtopic:"Context Optimization",
  question:`During testing, combined outputs from the web search agent (85K tokens including page content) and the document analysis agent (70K tokens including reasoning chains) total 155K tokens, but the synthesis agent performs optimally with inputs under 50K tokens. What's the most effective solution?`,
  options:[
    `Have the synthesis agent process findings in sequential batches, maintaining running state between calls`,
    `Add an intermediate summarization agent that condenses findings before passing to synthesis`,
    `Modify upstream agents to return structured data (key facts, citations, relevance scores) instead of verbose content and reasoning`,
    `Store findings in a vector database and give the synthesis agent retrieval tools to query during its work`],
  correct:[2],
  explanation:`Have upstream agents return structured data (key facts, citations, scores) instead of verbose content/reasoning, cutting tokens at the source. Sequential batching (A) adds state complexity; an extra summarizer (B) adds a hop and risk; a vector DB (D) is over-engineered here.` },

{ n:13, domain:"D1", subtopic:"Scope Partitioning",
  question:`When researching a broad topic, you observe that the web search agent and document analysis agent are both investigating the same subtopics, resulting in significant overlap in their findings. Token usage has nearly doubled without proportionally increasing the breadth or depth of research coverage. What's the most effective way to address this?`,
  options:[
    `Implement a shared state mechanism where agents log their current focus area, allowing other agents to dynamically avoid duplicating work in progress`,
    `Allow both agents to complete their parallel work, then have the coordinator deduplicate overlapping findings before passing to the synthesis agent`,
    `Convert to sequential execution where document analysis runs only after web search completes, using the web search findings as context to avoid duplication`,
    `Have the coordinator explicitly partition the research space before delegation, assigning distinct subtopics or source types to each agent`],
  correct:[3],
  explanation:`Have the coordinator partition the research space before delegating (distinct subtopics/source types) to prevent overlap. Shared-state logging (A) and post-hoc dedup (B) waste tokens first; forcing sequential execution (C) sacrifices parallelism.` },

{ n:14, domain:"D5", subtopic:"Error Propagation",
  question:`The document analysis subagent encounters a corrupted PDF file it cannot parse. When designing the system's error handling, what is the most effective way to handle this failure?`,
  options:[
    `Silently skip the corrupted document and continue processing other files to avoid interrupting the workflow.`,
    `Automatically retry parsing the document three times with exponential backoff before reporting failure.`,
    `Throw an exception that terminates the entire research workflow.`,
    `Return the error with context to the coordinator agent, letting it decide how to proceed.`],
  correct:[3],
  explanation:`Return the error with context to the coordinator and let it decide. Silently skipping (A) loses data, blind retries (B) won't help a corrupt file, and terminating the whole workflow (C) is overkill for one bad document.` },

{ n:15, domain:"D5", subtopic:"Error Propagation",
  question:`The web search subagent times out while researching a complex topic. You need to design how this failure information flows back to the coordinator agent. Which error propagation approach best enables intelligent recovery?`,
  options:[
    `Catch the timeout within the subagent and return an empty result set marked as successful.`,
    `Propagate the timeout exception directly to a top-level handler that terminates the entire research workflow.`,
    `Implement automatic retry logic with exponential backoff within the subagent, returning a generic "search unavailable" status only after all retries are exhausted.`,
    `Return structured error context to the coordinator including the failure type, the attempted query, any partial results, and potential alternative approaches.`],
  correct:[3],
  explanation:`Return structured error context (failure type, attempted query, partial results, alternatives) so the coordinator can retry, reroute, or proceed. Empty-as-success (A) hides it; terminating (B) is drastic; a generic status after retries (C) discards useful context.` },
{ n:16, domain:"D3", subtopic:"Path-Specific Rules",

/* ---------------------------- state (memory only) ------------------------- */
let answered = {};       // n -> { picked:[indexes], correct:bool }
let filter = "ALL";

/* ------------------------------- helpers ---------------------------------- */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function domainKeysInData(){
  const present = new Set(QUESTIONS.map(q=>q.domain));
  const ordered = DOMAIN_ORDER.filter(k=>present.has(k));
  QUESTIONS.forEach(q=>{ if(!ordered.includes(q.domain)) ordered.push(q.domain); });
  return ordered;
}
function domName(k){ return DOMAIN_META[k] ? DOMAIN_META[k].name : k; }
function domShort(k){ return DOMAIN_META[k] ? DOMAIN_META[k].short : k; }
function domColor(k){ return DOMAIN_META[k] ? DOMAIN_META[k].color : "#555"; }
function countDomain(k){ return QUESTIONS.filter(q=>q.domain===k).length; }
function arraysEqual(a,b){ if(a.length!==b.length) return false; const s=[...a].sort(),t=[...b].sort(); return s.every((v,i)=>v===t[i]); }

/* ------------------------------- rendering -------------------------------- */
function renderTabs(){
  const tabs = document.getElementById("tabs");
  const keys = domainKeysInData();
  let html = `<button class="tab" role="tab" data-f="ALL" aria-pressed="${filter==='ALL'}">All <span class="cnt">(${QUESTIONS.length})</span></button>`;
  keys.forEach(k=>{
    html += `<button class="tab" role="tab" data-f="${k}" aria-pressed="${filter===k}" title="${esc(domName(k))}">`+
            `<span class="dot" style="background:${domColor(k)}"></span>${esc(k+" · "+domShort(k))} <span class="cnt">(${countDomain(k)})</span></button>`;
  });
  tabs.innerHTML = html;
  tabs.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{ filter=b.dataset.f; renderTabs(); renderQuiz(); window.scrollTo({top:0,behavior:"smooth"}); }));
}

function renderScore(){
  const ansKeys = Object.keys(answered);
  const ans = ansKeys.length;
  const cor = ansKeys.filter(n=>answered[n].correct).length;
  const pct = ans ? Math.round(cor/ans*100) : 0;
  document.getElementById("scoreline").innerHTML = `Answered <b>${ans}/${QUESTIONS.length}</b> · <b>${cor}</b> correct · <b>${pct}%</b>`;
  document.getElementById("pbar").style.width = (QUESTIONS.length ? (ans/QUESTIONS.length*100) : 0) + "%";
}

function renderWeight(){
  const total = QUESTIONS.length || 1;
  const keys = domainKeysInData();
  let html = "";
  keys.forEach(k=>{
    const list = QUESTIONS.filter(q=>q.domain===k);
    const cnt = list.length;
    const pct = Math.round(cnt/total*100);
    const subMap = {};
    list.forEach(q=>{ subMap[q.subtopic]=(subMap[q.subtopic]||0)+1; });
    const subs = Object.keys(subMap).sort((a,b)=>subMap[b]-subMap[a]);
    html += `<div class="dom-row">
      <div class="dom-head"><span class="dot" style="display:inline-block;width:11px;height:11px;border-radius:50%;background:${domColor(k)}"></span>
        <span>${esc(domName(k))}</span><span class="pct">${cnt} q · ${pct}%</span></div>
      <div class="dom-meter"><i style="width:${pct}%;background:${domColor(k)}"></i></div>
      <div class="subs">${subs.map(s=>`<span class="sub">${esc(s)} <b>${subMap[s]}</b></span>`).join("")}</div>
    </div>`;
  });
  document.getElementById("weightBody").innerHTML = html;
}

function optClass(q,i,picked){
  const isCorrect = q.correct.includes(i);
  const isPicked = picked.includes(i);
  if(isCorrect) return "correct";
  if(isPicked && !isCorrect) return "wrong";
  return "";
}
function optTag(q,i,picked){
  const isCorrect = q.correct.includes(i);
  const isPicked = picked.includes(i);
  if(isCorrect && isPicked) return `<span class="mark">✓</span><span class="tag">Correct — your pick</span>`;
  if(isCorrect) return `<span class="mark">✓</span><span class="tag">Correct answer</span>`;
  if(isPicked) return `<span class="mark">✗</span><span class="tag">Your pick</span>`;
  return `<span class="mark" aria-hidden="true"></span>`;
}

function renderQuiz(){
  const quiz = document.getElementById("quiz");
  const list = QUESTIONS.filter(q=> filter==="ALL" || q.domain===filter);
  if(!list.length){ quiz.innerHTML = `<div class="empty">No questions in this domain.</div>`; return; }
  quiz.innerHTML = list.map(q=>cardHTML(q)).join("");
  list.forEach(q=>wireCard(q));
  renderScore();
}

function cardHTML(q){
  const a = answered[q.n];
  const picked = a ? a.picked : [];
  const locked = !!a;
  const letters = ["A","B","C","D","E","F"];
  const opts = q.options.map((o,i)=>{
    const cls = locked ? optClass(q,i,picked) : "";
    const chosen = (!locked) ? "" : (picked.includes(i)?"chosenbox":"");
    if(q.multi && !locked){
      return `<label class="opt ${chosen}"><input type="checkbox" data-i="${i}"><span class="letter">${letters[i]}</span><span class="otext">${esc(o)}</span></label>`;
    }
    const tag = locked ? optTag(q,i,picked) : `<span class="mark" aria-hidden="true"></span>`;
    return `<button class="opt ${cls} ${chosen}" type="button" data-i="${i}" ${locked?"disabled":""} aria-pressed="${picked.includes(i)}">
      <span class="letter">${letters[i]}</span><span class="otext">${esc(o)}</span>${tag}</button>`;
  }).join("");
  const checkBtn = (q.multi && !locked) ? `<button class="btn checkbtn" type="button" data-check="${q.n}">Check answer</button>` : "";
  const expCls = "explain" + (locked?" show":"") + (q.flag?" warn":"");
  const verify = q.flag ? `<div class="verify">⚠ Verify this answer against official material — the best choice here is debatable.</div>` : "";
  const flagChip = q.flag ? `<span class="chip flag">⚠ verify</span>` : "";
  const correctLetters = q.correct.map(i=>letters[i]).join(", ");
  return `<div class="qcard" id="q${q.n}">
    <div class="qtop">
      <span class="qnum">Q${q.n}</span>
      <span class="chip" style="background:${domColor(q.domain)}">${esc(q.domain+" · "+domShort(q.domain))}</span>
      <span class="chip sub">${esc(q.subtopic)}</span>
      ${q.multi?'<span class="chip sub">choose '+q.correct.length+'</span>':''}
      ${flagChip}
    </div>
    <div class="qtext">${esc(q.question)}</div>
    ${q.code?`<pre class="code">${esc(q.code)}</pre>`:""}
    <div class="opts">${opts}</div>
    ${checkBtn}
    <div class="${expCls}" role="region">
      <div class="lbl">Answer: ${correctLetters}</div>
      <div>${esc(q.explanation)}</div>
      ${verify}
    </div>
  </div>`;
}

function wireCard(q){
  if(answered[q.n]) return;
  const card = document.getElementById("q"+q.n);
  if(!card) return;
  if(q.multi){
    const btn = card.querySelector("[data-check]");
    btn && btn.addEventListener("click",()=>{
      const picked = [...card.querySelectorAll("input[type=checkbox]:checked")].map(c=>+c.dataset.i);
      if(!picked.length) return;
      commit(q,picked);
    });
  } else {
    card.querySelectorAll(".opt").forEach(b=>{
      b.addEventListener("click",()=>commit(q,[+b.dataset.i]));
    });
  }
}

function commit(q,picked){
  const correct = arraysEqual(picked, q.correct);
  answered[q.n] = { picked, correct };
  renderQuiz();
  const el = document.getElementById("q"+q.n);
  if(el) el.scrollIntoView({block:"nearest"});
}

function resetAll(){
  answered = {};
  renderQuiz();
  window.scrollTo({top:0,behavior:"smooth"});
}

/* --------------------------------- init ----------------------------------- */
document.getElementById("resetBtn").addEventListener("click",resetAll);
renderTabs();
renderWeight();
renderQuiz();
renderScore();
</script>
</body>
</html>
